<h1>Horizontal Bar</h1>
<p>The horizontal bar is used to separate content or highlight content, such as a title.</p>
<h2>Syntax</h2>
<p>Markdown:</p>
<pre><code class="language-markdown">---
</code></pre>
<p>or</p>
<pre><code class="language-markdown">***
</code></pre>
<p>HTML:</p>
<pre><code class="language-html">&lt;hr&gt;
</code></pre>
<h2>Pseudo-elements</h2>
<p>The horizontal bar offers no pseudo-elements.</p>
