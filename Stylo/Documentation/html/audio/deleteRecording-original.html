        <h1>Delete a recording</h1>
<p>Deleting a recording can be done through the audio panel by clicking the top right <em>Delete</em> button, represented by a trash can. The <em>Delete</em> button will appear if the audio recording is selected, or when the mouse goes over the audio recording.</p>
