        <h1>Save as...</h1>
<p>To save the document under another name:</p>
<ul>
<li>While pressing the option (<code>⌥</code>) key, from the menu choose <code>File</code>→<code>Save as...</code></li>
<li>In the <code>Save as</code> panel chose the desired name and the destination.</li>
</ul>
