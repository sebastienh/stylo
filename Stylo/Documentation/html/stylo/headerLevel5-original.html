        <h1>Header level 5</h1>
<p>To create a header level 5:</p>
<ul>
<li>Textually, enter <code>#####</code>, one or more spaces, and the title itself</li>
<li>From the menu, choose: <code>Format</code>→<code>Heading 5</code></li>
<li>With the keyboard shortcut, enter <code>⌘5</code></li>
</ul>
<p>See  <a href="../markdown#mdHeaders">Markdown</a> reference for more information.</p>
