        <h1>Header level 6</h1>
<p>To create a header level 6:</p>
<ul>
<li>Textually, enter <code>######</code>, one or more spaces, and the title itself</li>
<li>From the menu, choose: <code>Format</code>→<code>Heading 6</code></li>
<li>With the keyboard shortcut, enter <code>⌘6</code></li>
</ul>
<p>See  <a href="../markdown/mdHeaders.html">Markdown</a> reference for more information.</p>
