        <h1>Sidebar button(s)</h1>
<p>A sidebar button allows to how or hide a sidebar might it be the left <a href="navigator.html">navigator</a> or the right <a href="utilityToolsArea.html">utility tools area</a> sidebar if there is any plugin using the <a href="utilityToolsArea.html">utility tools area</a> to display itself.</p>
<p>They are located in the middle of the content area in the left and right text margins.</p>
