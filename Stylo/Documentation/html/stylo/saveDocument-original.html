        <h1>Save a document</h1>
<p>Stylo will periodically save your documents as changes are made. But to save a document manually, do the following:</p>
<ul>
<li>From the menu, choose <code>File</code>→<code>Save</code></li>
<li>With the keyboard shortcut: <code>⌘S</code></li>
</ul>
