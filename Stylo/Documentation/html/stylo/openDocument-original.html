        <h1>Open a document</h1>
<p>To open a document:</p>
<ul>
<li>From the menu, choose <code>File</code>→<code>Open</code></li>
<li>With the keyboard shortcut: <code>⌘O</code></li>
</ul>
<p>Once the open panel is visible, chose the file to open.</p>
